<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRV Readiness & Daily Stress Check</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen py-8 px-4">
<div class="max-w-2xl mx-auto">
<h1 class="text-3xl font-bold text-pink-400 mb-1">HRV Readiness Check</h1>
<p class="text-gray-400 text-sm mb-6">Daily biometric log · Composite readiness score · 7-day trend</p>

<div class="bg-gray-800 rounded-2xl p-6 mb-5">
  <p class="text-sm font-semibold text-gray-300 mb-4">Today's Check-In</p>
  <div class="grid grid-cols-2 gap-4 mb-4">
    <div>
      <label class="block text-xs text-gray-400 mb-1" for="restingHR">Resting HR (bpm)</label>
      <input id="restingHR" type="number" value="60" min="30" max="120"
        class="w-full bg-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-pink-500"
        aria-label="Resting heart rate in beats per minute">
    </div>
    <div>
      <label class="block text-xs text-gray-400 mb-1" for="sleepHours">Sleep (hours)</label>
      <input id="sleepHours" type="number" value="7" min="0" max="12" step="0.5"
        class="w-full bg-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-pink-500"
        aria-label="Sleep duration in hours">
    </div>
    <div>
      <label class="block text-xs text-gray-400 mb-1" for="energyLevel">Energy Level (1-5)</label>
      <div class="flex gap-1" role="group" aria-label="Subjective energy level 1 to 5">
        <div id="energyBtns" class="flex gap-1"></div>
      </div>
    </div>
    <div>
      <label class="block text-xs text-gray-400 mb-1" for="stressLevel">Stress Level (1-5)</label>
      <div id="stressBtns" class="flex gap-1" role="group" aria-label="Stress level 1 to 5"></div>
    </div>
  </div>
  <button id="logBtn" class="w-full py-2.5 bg-pink-600 hover:bg-pink-500 rounded-xl font-semibold transition"
    aria-label="Log today's readiness data">Log Today</button>
</div>

<div id="scoreCard" class="hidden bg-gray-800 rounded-2xl p-6 mb-5">
  <div class="flex items-center gap-5">
    <div id="scoreCircle" class="w-24 h-24 rounded-full flex items-center justify-center text-3xl font-bold flex-shrink-0 border-4" role="img" aria-label="Readiness score"></div>
    <div>
      <p class="text-xs uppercase tracking-widest text-gray-400">Readiness Score</p>
      <p id="scoreValue" class="text-4xl font-bold mt-1"></p>
      <p id="scoreLabel" class="text-sm mt-1"></p>
    </div>
  </div>
  <div id="scoreBreakdown" class="mt-4 grid grid-cols-2 gap-2 text-xs text-gray-400"></div>
</div>

<div class="bg-gray-800 rounded-2xl p-5">
  <p class="text-sm font-semibold text-gray-300 mb-3">7-Day Trend</p>
  <canvas id="trendChart" height="140" role="img" aria-label="7-day readiness score trend chart" class="w-full rounded-lg"></canvas>
  <div id="historyList" class="mt-3 space-y-1 max-h-40 overflow-y-auto"></div>
  <p id="noHistory" class="text-gray-600 text-xs text-center py-3">No history yet</p>
</div>
</div>

<script>
const LS_KEY = 'hrv_readiness_v1';
let selectedEnergy = 3;
let selectedStress = 2;

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { return []; }
}
function saveHistory(h) { localStorage.setItem(LS_KEY, JSON.stringify(h)); }

function makePicker(containerId, selected, onSelect) {
  const container = document.getElementById(containerId);
  container.textContent = '';
  for (let i = 1; i <= 5; i++) {
    const btn = document.createElement('button');
    btn.className = 'w-9 h-9 rounded-lg font-bold text-sm transition ' +
      (i === selected ? 'bg-pink-500 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600');
    btn.textContent = i;
    btn.setAttribute('aria-pressed', i === selected ? 'true' : 'false');
    btn.setAttribute('aria-label', 'Select ' + i);
    btn.addEventListener('click', () => {
      selected = i;
      onSelect(i);
      makePicker(containerId, i, onSelect);
    });
    container.appendChild(btn);
  }
}

function calcScore(hr, sleep, energy, stress) {
  // Normalize each component 0-100
  // HR: lower better. 50=100, 90=0
  const hrScore = Math.max(0, Math.min(100, ((90 - hr) / 40) * 100));
  // Sleep: 8h = 100, 4h = 0
  const sleepScore = Math.max(0, Math.min(100, ((sleep - 4) / 4) * 100));
  // Energy: 5=100, 1=0
  const energyScore = (energy - 1) / 4 * 100;
  // Stress: lower better. 1=100, 5=0
  const stressScore = (5 - stress) / 4 * 100;
  // Weighted composite
  return Math.round(hrScore * 0.25 + sleepScore * 0.30 + energyScore * 0.25 + stressScore * 0.20);
}

function scoreColor(score) {
  if (score >= 70) return { bg: '#166534', border: '#22c55e', text: '#4ade80', label: 'High Readiness', labelClass: 'text-green-400' };
  if (score >= 40) return { bg: '#713f12', border: '#eab308', text: '#fde047', label: 'Moderate Readiness', labelClass: 'text-yellow-400' };
  return { bg: '#7f1d1d', border: '#ef4444', text: '#f87171', label: 'Low Readiness', labelClass: 'text-red-400' };
}

function showScore(entry) {
  const score = entry.score;
  const colors = scoreColor(score);
  const card = document.getElementById('scoreCard');
  const circle = document.getElementById('scoreCircle');
  circle.style.backgroundColor = colors.bg;
  circle.style.borderColor = colors.border;
  circle.style.color = colors.text;
  circle.textContent = score;
  circle.setAttribute('aria-label', 'Readiness score: ' + score);
  document.getElementById('scoreValue').textContent = score + '/100';
  document.getElementById('scoreValue').className = 'text-4xl font-bold mt-1 ' + colors.labelClass;
  document.getElementById('scoreLabel').textContent = colors.label;
  document.getElementById('scoreLabel').className = 'text-sm mt-1 ' + colors.labelClass;
  const breakdown = document.getElementById('scoreBreakdown');
  breakdown.textContent = '';
  const items = [
    ['Resting HR', entry.hr + ' bpm'],
    ['Sleep', entry.sleep + 'h'],
    ['Energy', entry.energy + '/5'],
    ['Stress', entry.stress + '/5'],
  ];
  items.forEach(([k, v]) => {
    const kEl = document.createElement('span');
    kEl.className = 'text-gray-500';
    kEl.textContent = k + ':';
    const vEl = document.createElement('span');
    vEl.className = 'text-gray-300 font-semibold';
    vEl.textContent = v;
    breakdown.appendChild(kEl);
    breakdown.appendChild(vEl);
  });
  card.classList.remove('hidden');
}

function drawTrend(history) {
  const canvas = document.getElementById('trendChart');
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth * devicePixelRatio;
  const H = canvas.offsetHeight * devicePixelRatio;
  canvas.width = W; canvas.height = H;
  ctx.fillStyle = '#1f2937'; ctx.fillRect(0, 0, W, H);
  const recent = history.slice(-7);
  if (recent.length === 0) return;
  const pad = { top: 15, right: 15, bottom: 30, left: 40 };
  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;
  function xp(i) { return pad.left + (i / Math.max(recent.length - 1, 1)) * chartW; }
  function yp(v) { return pad.top + chartH - (v / 100) * chartH; }
  [0, 40, 70, 100].forEach(v => {
    ctx.strokeStyle = v === 40 ? '#b45309' : v === 70 ? '#166534' : '#374151';
    ctx.setLineDash(v === 40 || v === 70 ? [4,4] : []);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.left, yp(v)); ctx.lineTo(W - pad.right, yp(v)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#6b7280'; ctx.font = `${9*devicePixelRatio}px sans-serif`;
    ctx.fillText(v, 2, yp(v) + 4);
  });
  ctx.beginPath();
  ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 2.5 * devicePixelRatio;
  recent.forEach((e, i) => {
    const x = xp(i), y = yp(e.score);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  recent.forEach((e, i) => {
    const colors = scoreColor(e.score);
    const x = xp(i), y = yp(e.score);
    ctx.beginPath();
    ctx.arc(x, y, 4 * devicePixelRatio, 0, Math.PI * 2);
    ctx.fillStyle = colors.border; ctx.fill();
    const d = new Date(e.date);
    ctx.fillStyle = '#9ca3af'; ctx.font = `${8*devicePixelRatio}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText((d.getMonth()+1)+'/'+d.getDate(), x, H - pad.bottom + 12);
    ctx.textAlign = 'left';
  });
}

function renderHistory(history) {
  const list = document.getElementById('historyList');
  const noHist = document.getElementById('noHistory');
  list.textContent = '';
  if (history.length === 0) { noHist.classList.remove('hidden'); return; }
  noHist.classList.add('hidden');
  [...history].reverse().slice(0, 7).forEach(e => {
    const colors = scoreColor(e.score);
    const row = document.createElement('div');
    row.className = 'flex justify-between items-center text-xs py-1 border-b border-gray-700';
    const dateEl = document.createElement('span');
    dateEl.className = 'text-gray-400';
    dateEl.textContent = e.date;
    const scoreEl = document.createElement('span');
    scoreEl.className = 'font-bold ' + colors.labelClass;
    scoreEl.textContent = e.score + '/100 — ' + colors.label;
    row.appendChild(dateEl); row.appendChild(scoreEl);
    list.appendChild(row);
  });
  setTimeout(() => drawTrend(history), 30);
}

document.getElementById('logBtn').addEventListener('click', () => {
  const hr = parseInt(document.getElementById('restingHR').value);
  const sleep = parseFloat(document.getElementById('sleepHours').value);
  const score = calcScore(hr, sleep, selectedEnergy, selectedStress);
  const today = new Date().toISOString().slice(0, 10);
  const entry = { date: today, hr, sleep, energy: selectedEnergy, stress: selectedStress, score };
  const history = loadHistory();
  const existIdx = history.findIndex(e => e.date === today);
  if (existIdx >= 0) history[existIdx] = entry; else history.push(entry);
  saveHistory(history);
  showScore(entry);
  renderHistory(history);
});

makePicker('energyBtns', selectedEnergy, v => { selectedEnergy = v; });
makePicker('stressBtns', selectedStress, v => { selectedStress = v; });

const history = loadHistory();
renderHistory(history);
if (history.length > 0) showScore(history[history.length - 1]);

window.addEventListener('resize', () => renderHistory(loadHistory()));
</script>
</body>
</html>
